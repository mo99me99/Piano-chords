<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آکوردهای پرده‌های سیاه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --panel: #1f1a15;
    --ivory: #f6efe1;
    --ivory-dim: #cfc6b4;
    --key-white: #f8f3e8;
    --key-white-shadow: #d9cfba;
    --key-black: #211c19;
    --key-black-sheen: #3a332c;
    --gold: #d3a24e;
    --wine: #b5606b;
    --text-dark: #241d15;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at top, #241d16 0%, var(--bg) 60%);
    color: var(--ivory);
    font-family: 'Vazirmatn', sans-serif;
    display:flex;
    justify-content:center;
    padding: 28px 14px 40px;
  }
  .wrap{ width:100%; max-width: 560px; }
  h1{
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--ivory);
  }
  p.sub{
    margin: 0 0 24px;
    color: var(--ivory-dim);
    font-size: 0.85rem;
    line-height: 1.7;
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    margin-bottom: 16px;
  }
  .mode-toggle button{
    flex:1;
    padding: 10px 0;
    border-radius: 10px;
    border: 1px solid #3a322a;
    background: transparent;
    color: var(--ivory-dim);
    font-family:'Vazirmatn';
    font-size: 0.9rem;
    font-weight:600;
    cursor:pointer;
    transition: all .15s ease;
  }
  .mode-toggle button.active[data-mode="major"]{
    background: var(--gold);
    border-color: var(--gold);
    color: #241a08;
  }
  .mode-toggle button.active[data-mode="minor"]{
    background: var(--wine);
    border-color: var(--wine);
    color: #2a0f13;
  }

  .group-label{
    color: var(--ivory-dim);
    font-size: 0.75rem;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .roots{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .roots.black{
    grid-template-columns: repeat(5, 1fr);
    margin-bottom: 22px;
  }
  .roots button{
    padding: 9px 2px;
    border-radius: 8px;
    border: 1px solid #3a322a;
    background: var(--panel);
    color: var(--ivory);
    font-family: 'Fraunces', serif;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    cursor:pointer;
    transition: all .15s ease;
  }
  .roots button.active{
    background: var(--ivory);
    color: var(--text-dark);
    border-color: var(--ivory);
  }

  .piano{
    position: relative;
    height: 150px;
    display:flex;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    margin-bottom: 18px;
    direction: ltr;
  }
  .white-key{
    position:relative;
    flex:1;
    background: linear-gradient(to bottom, var(--key-white), var(--key-white-shadow));
    border-right: 1px solid #b9ac93;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 10px;
    transition: background .15s ease;
  }
  .white-key:last-child{ border-right:none; }
  .white-key .label{
    font-family:'Fraunces', serif;
    font-size: 0.8rem;
    color: #9b8f76;
    font-weight:500;
  }
  .white-key.lit{ background: linear-gradient(to bottom, var(--gold), #b8873a); }
  .white-key.lit.minor{ background: linear-gradient(to bottom, var(--wine), #8f4650); }
  .white-key.lit .label{ color: #2a1c08; font-weight:700; }
  .white-key.lit.minor .label{ color: #2a0f13; }

  .black-key{
    position:absolute;
    top:0;
    width: 3.6%;
    height: 62%;
    background: linear-gradient(to bottom, var(--key-black-sheen), var(--key-black));
    border-radius: 0 0 4px 4px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 8px;
    z-index: 2;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    transition: background .15s ease;
  }
  .black-key .label{
    font-family:'Fraunces', serif;
    font-size: 0.68rem;
    color: #9a9086;
    font-weight:500;
  }
  .black-key.lit{ background: linear-gradient(to bottom, var(--gold), #a97c33); }
  .black-key.lit.minor{ background: linear-gradient(to bottom, var(--wine), #7d3d47); }
  .black-key.lit .label{ color: #2a1c08; font-weight:700; }
  .black-key.lit.minor .label{ color: #f6dfe1; }

  .readout{
    background: var(--panel);
    border: 1px solid #33291f;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .readout .chord-name{
    font-family:'Fraunces', serif;
    font-size: 1.4rem;
    direction: ltr;
    text-align: center;
    color: var(--gold);
    margin: 0 0 2px;
  }
  .readout .chord-name.minor{ color: var(--wine); }
  .readout .notes{
    font-family:'Fraunces', serif;
    direction: ltr;
    text-align:center;
    font-size: 1.05rem;
    color: var(--ivory-dim);
    letter-spacing: 0.03em;
  }

  table.ref{
    width:100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  table.ref caption{
    text-align:right;
    color: var(--ivory-dim);
    font-size:0.8rem;
    margin-bottom:8px;
  }
  table.ref th, table.ref td{
    padding: 7px 6px;
    border-bottom: 1px solid #2e261d;
    text-align:center;
    direction: ltr;
  }
  table.ref th{
    color: var(--ivory-dim);
    font-family:'Vazirmatn';
    font-weight:600;
    font-size:0.78rem;
  }
  table.ref td.root{
    font-family:'Fraunces', serif;
    color: var(--ivory);
    font-weight:600;
  }
  table.ref td.major{ color: #e0b96c; font-family:'Fraunces', serif;}
  table.ref td.minor{ color: #cb8790; font-family:'Fraunces', serif;}

  .credit{
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid #2e261d;
    text-align: center;
    font-size: 0.82rem;
    color: var(--ivory-dim);
    line-height: 1.8;
  }
  .credit .heart{ color: var(--wine); }
  .credit a{
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    transition: color .15s ease;
  }
  .credit a:hover{ color: var(--ivory); }
  .credit .ig{
    display: block;
    margin-top: 4px;
    direction: ltr;
    font-family: 'Fraunces', serif;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ivory-dim);
  }
  .credit a.ig:hover{ color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <h1>آکوردهای ماژور و مینور روی پیانو</h1>
  <p class="sub">یکی از حالت‌ها و یکی از ریشه‌ها رو انتخاب کن تا روی کیبورد ببینیش.</p>

  <div class="mode-toggle">
    <button data-mode="major" class="active">ماژور</button>
    <button data-mode="minor">مینور</button>
  </div>

  <p class="group-label">کلیدهای سفید</p>
  <div class="roots" id="rootsWhite"></div>

  <p class="group-label">کلیدهای سیاه</p>
  <div class="roots black" id="rootsBlack"></div>

  <div class="piano" id="piano"></div>

  <div class="readout">
    <div class="chord-name" id="chordName">C major</div>
    <div class="notes" id="chordNotes">C – E – G</div>
  </div>

  <table class="ref">
    <caption>مرجع کامل</caption>
    <thead>
      <tr><th>ریشه</th><th>ماژور</th><th>مینور</th></tr>
    </thead>
    <tbody id="refBody"></tbody>
  </table>

  <footer class="credit">
    ساخته شده توسط
    <a href="https://www.instagram.com/mohammadmehdihosseini/" target="_blank" rel="noopener noreferrer">محمدمهدی</a>
    با <span class="heart">❤️</span>
    <a class="ig" href="https://www.instagram.com/mohammadmehdihosseini/" target="_blank" rel="noopener noreferrer">@mohammadmehdihosseini</a>
  </footer>
</div>

<script>
const chords = [
  { root: "C",  group:"white", major: ["C","E","G"],       minor: ["C","D#","G"] },
  { root: "D",  group:"white", major: ["D","F#","A"],      minor: ["D","F","A"] },
  { root: "E",  group:"white", major: ["E","G#","B"],      minor: ["E","G","B"] },
  { root: "F",  group:"white", major: ["F","A","C"],       minor: ["F","Ab","C"] },
  { root: "G",  group:"white", major: ["G","B","D"],       minor: ["G","Bb","D"] },
  { root: "A",  group:"white", major: ["A","C#","E"],      minor: ["A","C","E"] },
  { root: "B",  group:"white", major: ["B","D#","F#"],     minor: ["B","D","F#"] },
  { root: "Db", group:"black", major: ["Db","F","Ab"],     minor: ["Db","E","Ab"] },
  { root: "Eb", group:"black", major: ["Eb","G","Bb"],     minor: ["Eb","Gb","Bb"] },
  { root: "Gb", group:"black", major: ["Gb","Bb","Db"],    minor: ["Gb","A","Db"] },
  { root: "Ab", group:"black", major: ["Ab","C","Eb"],     minor: ["Ab","B","Eb"] },
  { root: "Bb", group:"black", major: ["Bb","D","F"],      minor: ["Bb","Db","F"] },
];

// pitch classes 0-11 for note-name -> keyboard position mapping
const pc = { C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3, E:4, F:5, "F#":6, Gb:6, G:7, "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11 };
const whiteOrder = ["C","D","E","F","G","A","B"];
const blackAfter = { C:"C#", D:"D#", F:"F#", G:"G#", A:"A#" }; // black key sits after this white key

let mode = "major";
let selected = 0; // index into chords[], defaults to C

function buildRoots(){
  const whiteEl = document.getElementById("rootsWhite");
  const blackEl = document.getElementById("rootsBlack");
  whiteEl.innerHTML = "";
  blackEl.innerHTML = "";
  chords.forEach((c,i)=>{
    const b = document.createElement("button");
    b.textContent = c.root;
    if(i===selected) b.classList.add("active");
    b.onclick = ()=>{ selected = i; render(); };
    (c.group === "white" ? whiteEl : blackEl).appendChild(b);
  });
}

function buildPiano(){
  // 14 white keys = 2 octaves, so a chord like A (A-C#-E) can be drawn
  // left-to-right starting at its own root and continuing into the next
  // octave instead of jumping back to C#/E earlier on the keyboard.
  const piano = document.getElementById("piano");
  piano.innerHTML = "";
  const totalWhite = whiteOrder.length * 2;
  for(let i=0;i<totalWhite;i++){
    const w = whiteOrder[i % 7];
    const octave = Math.floor(i / 7);
    const wk = document.createElement("div");
    wk.className = "white-key";
    wk.dataset.abs = pc[w] + 12*octave;
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = w;
    wk.appendChild(label);
    piano.appendChild(wk);
  }
  // position black keys as % of total width (14 white keys)
  const whiteWidthPct = 100/totalWhite;
  for(let i=0;i<totalWhite;i++){
    const w = whiteOrder[i % 7];
    const octave = Math.floor(i / 7);
    if(blackAfter[w]){
      const bk = document.createElement("div");
      bk.className = "black-key";
      bk.dataset.abs = pc[blackAfter[w]] + 12*octave;
      bk.style.left = (whiteWidthPct*(i+1) - (3.6/2)) + "%";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = blackAfter[w];
      bk.appendChild(label);
      piano.appendChild(bk);
    }
  }
}

function render(){
  buildRoots();
  document.querySelectorAll(".mode-toggle button").forEach(b=>{
    b.classList.toggle("active", b.dataset.mode === mode);
  });

  const chord = chords[selected];
  const notes = chord[mode];
  const rootPc = pc[notes[0]];
  // each note's absolute key position = root position + its interval
  // above the root (0-11). This keeps the notes in formula order
  // (root first, reading left to right) and lets later notes fall
  // into the second octave when their interval pushes past 11.
  const activeAbs = notes.map(n => rootPc + ((pc[n] - rootPc + 12) % 12));

  document.querySelectorAll(".white-key, .black-key").forEach(k=>{
    const p = parseInt(k.dataset.abs);
    k.classList.toggle("lit", activeAbs.includes(p));
    k.classList.toggle("minor", mode === "minor");
  });

  document.getElementById("chordName").textContent = chord.root + " " + (mode === "major" ? "major" : "minor");
  document.getElementById("chordName").classList.toggle("minor", mode === "minor");
  document.getElementById("chordNotes").textContent = notes.join(" – ");

  buildRefTable();
}

function buildRefTable(){
  const body = document.getElementById("refBody");
  body.innerHTML = "";
  chords.forEach(c=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="root">${c.root}</td><td class="major">${c.major.join("-")}</td><td class="minor">${c.minor.join("-")}</td>`;
    body.appendChild(tr);
  });
}

document.querySelectorAll(".mode-toggle button").forEach(b=>{
  b.onclick = ()=>{ mode = b.dataset.mode; render(); };
});

buildPiano();
render();
</script>
</body>
</html>
